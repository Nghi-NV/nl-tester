        // Embed the documentation content
        const docs = {"commands": "# \ud83d\udcd6 lumi-tester Command Reference\n\nT\u00e0i li\u1ec7u n\u00e0y li\u1ec7t k\u00ea chi ti\u1ebft \u0111\u1ea7y \u0111\u1ee7 **t\u1ea5t c\u1ea3 138 l\u1ec7nh (commands & aliases)** c\u00f3 th\u1ec3 s\u1eed d\u1ee5ng trong file YAML c\u1ee7a `lumi-tester` tr\u00ean c\u00e1c n\u1ec1n t\u1ea3ng **Android**, **Android Auto**, **iOS**, **Web**, **macOS**, **Windows** v\u00e0 **Hardware Jig Controller**.\n\n---\n\n## \ud83d\udccc B\u1ea3ng tra c\u1ee9u nhanh l\u1ec7nh (Quick Access Table Index)\n\n| Danh m\u1ee5c | L\u1ec7nh & K\u1ecbch b\u1ea3n \u00e1p d\u1ee5ng |\n| :--- | :--- |\n| \ud83d\udd0d **Selectors** | [`text`](#c\u00e1c-lo\u1ea1i-selector-ch\u00ednh), [`id`](#c\u00e1c-lo\u1ea1i-selector-ch\u00ednh), [`regex`](#c\u00e1c-lo\u1ea1i-selector-ch\u00ednh), [`type`](#-t\u00ecm-hi\u1ec3u-v\u1ec1-type-element-type), [`point`](#c\u00e1c-lo\u1ea1i-selector-ch\u00ednh), [`ocr`](#-ocr-selector-nh\u1eadn-di\u1ec7n-quang-h\u1ecdc), [`relative`](#v\u1ecb-tr\u00ed-t\u01b0\u01a1ng-\u0111\u1ed1i-relative-positioning), [`auto-scroll`](#t\u1ef1-\u0111\u1ed9ng-cu\u1ed9n-auto-scroll) |\n| \ud83d\udcf1 **App Lifecycle** | [`launchApp` / `open`](#open--launchapp), [`stopApp` / `stop`](#stopapp--stop), [`installApp`](#installapp), [`uninstallApp`](#uninstallapp), [`clearAppData`](#clearappdata), [`backgroundApp`](#backgroundapp) |\n| \ud83d\uddfa\ufe0f **Navigation** | [`back`](#back), [`pressHome` / `home`](#presshome--home), [`hideKeyboard`](#hidekeyboard--hidekbd), [`openLink`](#openlink--deeplink), [`navigate`](#navigate) |\n| \ud83d\udc46 **Interaction** | [`tap`](#tapon--tap), [`longPress`](#longpresson--longpress), [`doubleTap`](#doubletapon--doubletap), [`rightClick`](#rightclick--contextclick), [`inputText` / `write` / `type`](#inputtext--write--type), [`eraseText`](#erasetext--clear), [`tapAt` / `inputAt`](#tapat--inputat), [`pasteText`](#pastetext) |\n| \ud83d\udcdc **Scroll & Swipe** | [`swipeLeft` / `swipeRight` / `swipeUp` / `swipeDown`](#swipeleft--swiperight--swipeup--swipedown--swipe), [`scrollUntilVisible` / `scrollTo`](#scrolluntilvisible--scrollto) |\n| \ud83d\udc41\ufe0f **Assertions** | [`see` / `assertVisible`](#assertvisible--see), [`notSee`](#assertnotvisible--notsee), [`waitUntilVisible`](#waituntilvisible--waitsee), [`waitUntilNotVisible`](#waituntilnotvisible--waitnotsee), [`extendedWaitUntil`](#extendedwaituntil), [`assertColor`](#assertcolor--checkcolor), [`assertScreenshot`](#assertscreenshot) |\n| \u23f3 **Wait & Delays** | [`wait` / `await`](#wait--await), [`waitForAnimationToEnd`](#waitforanimationtoend) |\n| \ud83d\udce6 **Variables** | [`find` / `define`](#find--define), [`setVar`](#setvar), [`assertVar`](#assertvar), [`generate`](#generate) |\n| \ud83d\udd00 **Control Flow** | [`repeat`](#repeat), [`retry`](#retry), [`runFlow`](#runflow), [`conditional`](#conditional) |\n| \ud83d\udc0d **Scripting & Python** | [`runPython` / `execPython` / `python`](#-scripting--python-integration-t\u00edch-h\u1ee3p-script--python), [`runScript`](#runscript), [`evalScript`](#evalscript), [`assertTrue`](#asserttrue--assert) |\n| \ud83c\udf10 **Network & DB** | [`httpRequest`](#httprequest), [`setNetwork`](#setnetwork), [`airplaneMode`](#airplanemode--toggleairplanemode), [`dbQuery`](#dbquery) |\n| \ud83d\udccb **Clipboard & Files** | [`setClipboard` / `getClipboard` / `copyTextFrom`](#-clipboard--files-clipboard--qu\u1ea3n-l\u00fd-file), [`pushFile` / `pullFile`](#pushfile--pullfile) |\n| \ud83d\udcf8 **Artifacts & Reports** | [`screenshot`](#screenshot--takescreenshot--snapshot), [`startRecording` / `stopRecording`](#startrecording--stoprecording), [`exportReport`](#exportreport), [`sendLarkMessage` / `lark`](#sendlarkmessage--lark) |\n| \ud83d\udccd **GPS Simulation** | [`mockLocation` / `gps`](#mocklocation--gps), [`mockLocationControl`](#stopmocklocation--mocklocationcontrol), [`waitForLocation`](#waitforlocation--waitformockcompletion) |\n| \ud83c\udfac **GIF Recording** | [`captureGifFrame`](#-gif-recording-t\u1ea1o-gif-minh-h\u1ecda), [`buildGif`](#-gif-recording-t\u1ea1o-gif-minh-h\u1ecda) |\n| \u2699\ufe0f **Hardware Relay/Servo** | [`connectJig`](#connectjig--disconnectjig), [`turnOn` / `turnOff` / `powerCycle`](#turnon--turnoff--turnoffall--powercycle), [`clickButton` / `holdButton` / `releaseButton`](#clickbutton--pressbutton--holdbutton--releasebutton--releaseallbuttons--repeatclick), [`rotateServo` / `startRepeatClick`](#rotateservo--configureservo--startrepeatclick--stoprepeatclick), [`readServo` / `readRelay`](#readservo--readrelay) |\n| \ud83c\udfa8 **Hardware LED & Sensor** | [`seeLedColor` / `seeLedBlink`](#seeledcolor--seeledblink--seeledoff), [`setSensorLight`](#setsensorlight--setbrightnessthresholds--waitforbrightness--waitforcct), [`waitForBrightness` / `waitForCct`](#setsensorlight--setbrightnessthresholds--waitforbrightness--waitforcct), [`calibrateColor` / `saveCalibration`](#calibratecolor--calibratebrightness--addcctpoint--savecalibration--loadcalibration--resetcalibration--erasecalibration) |\n| \ud83d\udcf7 **Camera Profile** | [`assertDeviceState`](#-camera-profile-assertions-ki\u1ec3m-tra-tr\u1ea1ng-th\u00e1i-qua-camera), [`waitDeviceState`](#-camera-profile-assertions-ki\u1ec3m-tra-tr\u1ea1ng-th\u00e1i-qua-camera), [`assertDeviceTransition`](#-camera-profile-assertions-ki\u1ec3m-tra-tr\u1ea1ng-th\u00e1i-qua-camera), [`waitLedPattern`](#-camera-profile-assertions-ki\u1ec3m-tra-tr\u1ea1ng-th\u00e1i-qua-camera) |\n| \ud83d\udd0a **Audio & Media** | [`playMedia` / `stopMedia`](#-audio--media-playback-\u00e2m-thanh--truy\u1ec1n-th\u00f4ng), [`startAudioCapture` / `verifyAudioDucking`](#startaudiocapture--stopaudiocapture--verifyaudioducking) |\n| \ud83d\udee0\ufe0f **System Settings** | [`rotate`](#rotate--setorientation), [`press`](#press--presskey), [`inputRandomEmail` / `inputRandomNumber`](#random-inputs-inputrandomemail--inputrandomnumber--inputrandompersonname--inputrandomtext), [`setVolume` / `lockDevice`](#system-controls-opennotifications--openquicksettings--setvolume--lockdevice--unlockdevice--selectdisplay--setlocale), [`assertPerformance` / `setCpuThrottling`](#performance-profiling-startprofiling--stopprofiling--assertperformance--setcputhrottling--setnetworkconditions) |\n\n---\n\n## \ud83d\udd0d Selectors & Global Parameters\n\nNhi\u1ec1u l\u1ec7nh t\u01b0\u01a1ng t\u00e1c (nh\u01b0 `tap`, `see`, `scrollTo`) s\u1eed d\u1ee5ng chung m\u1ed9t b\u1ed9 tham s\u1ed1 \u0111\u1ec3 x\u00e1c \u0111\u1ecbnh ph\u1ea7n t\u1eed tr\u00ean m\u00e0n h\u00ecnh.\n\n### C\u00e1c lo\u1ea1i Selector ch\u00ednh\n| Tr\u01b0\u1eddng | Alias | M\u00f4 t\u1ea3 |\n| :--- | :--- | :--- |\n| `text` | - | T\u00ecm theo v\u0103n b\u1ea3n hi\u1ec3n th\u1ecb (kh\u1edbp ch\u00ednh x\u00e1c ho\u1eb7c ch\u1ee9a chu\u1ed7i). |\n| `id` | - | Resource ID (Android/Web), Accessibility ID (iOS), ho\u1eb7c Name/AutomationId (Windows/macOS). |\n| `regex` | - | Kh\u1edbp v\u0103n b\u1ea3n b\u1eb1ng bi\u1ec3u th\u1ee9c ch\u00ednh quy (Regex). |\n| `desc` | `contentDesc`, `accessibilityId` | T\u00ecm theo m\u00f4 t\u1ea3 n\u1ed9i dung (Accessibility Label). |\n| `type` | `element_type` | Lo\u1ea1i ph\u1ea7n t\u1eed (Class View / XCUIElement / HTML tag). |\n| `point` | - | T\u1ecda \u0111\u1ed9 tuy\u1ec7t \u0111\u1ed1i `\"x,y\"` ho\u1eb7c ph\u1ea7n tr\u0103m `\"x%,y%\"`. |\n| `css` | - | (Ch\u1ec9 Web) CSS Selector. |\n| `xpath` | - | XPath Selector. |\n| `image` | - | Template matching theo \u1ea3nh m\u1eabu. |\n| `ocr` | - | T\u00ecm text b\u1eb1ng nh\u1eadn di\u1ec7n quang h\u1ecdc (OCR). H\u1ed7 tr\u1ee3 regex. |\n\n---\n\n### \ud83e\uddf1 T\u00ecm hi\u1ec3u v\u1ec1 `type` (Element Type)\nTr\u01b0\u1eddng `type` gi\u00fap thu h\u1eb9p ph\u1ea1m vi t\u00ecm ki\u1ebfm b\u1eb1ng c\u00e1ch ch\u1ec9 \u0111\u1ecbnh lo\u1ea1i th\u00e0nh ph\u1ea7n:\n- **Android**: `Button`, `EditText`, `TextView`, `ImageView`, `CheckBox`, `Switch`.\n- **iOS**: `Button`, `TextField`, `SecureTextField`, `StaticText`, `Image`, `Cell`.\n- **Web**: `input`, `button`, `a`, `span`, `div`, `p`.\n\n---\n\n### \ud83d\udd0d Gi\u1ea3i th\u00edch v\u1ec1 Regex\n- `\\d+`: D\u00e3y s\u1ed1 b\u1ea5t k\u1ef3.\n- `\\d{6}`: M\u00e3 OTP 6 ch\u1eef s\u1ed1.\n- `.+`: \u0110o\u1ea1n ch\u1eef b\u1ea5t k\u1ef3.\n- `(Nam|N\u1eef)`: Kh\u1edbp \"Nam\" ho\u1eb7c \"N\u1eef\".\n\n---\n\n### V\u1ecb tr\u00ed t\u01b0\u01a1ng \u0111\u1ed1i (Relative Positioning)\n- `rightOf`, `leftOf`, `above`, `below`.\n```yaml\n- tap:\n    rightOf: \"Username\"\n    type: \"EditText\"\n```\n\n### \ud83d\udcf7 OCR Selector (Nh\u1eadn di\u1ec7n quang h\u1ecdc)\n```yaml\n- tap:\n    ocr:\n      text: \"Start Game\"\n      index: 0\n      region: \"bottom-half\" # top-left, top-right, bottom-left, bottom-right, top-half, bottom-half, center\n```\n\n### T\u1ef1 \u0111\u1ed9ng cu\u1ed9n (Auto-scroll)\n```yaml\n- tap:\n    text: \"Save\"\n    scrollable:\n      enable: true\n      index: 0\n```\n\n---\n\n## \ud83d\udcf1 App Management & Lifecycle (Qu\u1ea3n l\u00fd \u1ee8ng d\u1ee5ng)\n\n### `open` / `launchApp`\n**M\u00f4 t\u1ea3**: M\u1edf m\u1ed9t \u1ee9ng d\u1ee5ng tr\u00ean thi\u1ebft b\u1ecb. H\u1ed7 tr\u1ee3 Package name (Android), Bundle ID (iOS), `.app` (macOS), ho\u1eb7c `.exe` path (Windows). Tr\u00ean macOS/Windows c\u1ea7n c\u1ea5u h\u00ecnh `desktopState.clear` \u1edf header \u0111\u1ec3 x\u00f3a d\u1eef li\u1ec7u desktop state.\n\n```yaml\n- launchApp:\n    appId: \"com.example.app\"\n    clearState: true\n    permissions:\n      notifications: \"allow\"\n      location: \"always\"\n```\n\n### `stopApp` / `stop`\n**M\u00f4 t\u1ea3**: D\u1eebng (kill) \u1ee9ng d\u1ee5ng \u0111ang ch\u1ea1y.\n\n```yaml\n- stopApp: \"com.example.app\"\n```\n\n### `installApp`\n**M\u00f4 t\u1ea3**: C\u00e0i \u0111\u1eb7t file \u1ee9ng d\u1ee5ng (.apk, .ipa, .app path) v\u00e0o thi\u1ebft b\u1ecb.\n\n```yaml\n- installApp: \"./builds/app-debug.apk\"\n```\n\n### `uninstallApp`\n**M\u00f4 t\u1ea3**: G\u1ee1 c\u00e0i \u0111\u1eb7t \u1ee9ng d\u1ee5ng theo package/bundle ID.\n\n```yaml\n- uninstallApp: \"com.example.app\"\n```\n\n### `clearAppData`\n**M\u00f4 t\u1ea3**: X\u00f3a d\u1eef li\u1ec7u v\u00e0 cache c\u1ee7a \u1ee9ng d\u1ee5ng Android. Kh\u00f4ng d\u00f9ng l\u1ec7nh n\u00e0y cho macOS/Windows; desktop c\u1ea7n `desktopState.clear` trong header v\u00e0 `launchApp: { clearState: true }`.\n\n```yaml\n- clearAppData: \"com.example.app\"\n```\n\n### `backgroundApp`\n**M\u00f4 t\u1ea3**: \u0110\u01b0a \u1ee9ng d\u1ee5ng xu\u1ed1ng n\u1ec1n trong kho\u1ea3ng th\u1eddi gian quy \u0111\u1ecbnh r\u1ed3i t\u1ef1 m\u1edf l\u1ea1i.\n\n```yaml\n- backgroundApp:\n    durationMs: 5000\n```\n\n---\n\n## \ud83d\uddfa\ufe0f Navigation & Links (\u0110i\u1ec1u h\u01b0\u1edbng)\n\n### `back`\n**M\u00f4 t\u1ea3**: Nh\u1ea5n n\u00fat Back h\u1ec7 th\u1ed1ng (Esc tr\u00ean Desktop).\n\n```yaml\n- back\n```\n\n### `pressHome` / `home`\n**M\u00f4 t\u1ea3**: Nh\u1ea5n n\u00fat Home \u0111\u1ec3 v\u1ec1 m\u00e0n h\u00ecnh ch\u00ednh.\n\n```yaml\n- home\n```\n\n### `hideKeyboard` / `hideKbd`\n**M\u00f4 t\u1ea3**: \u1ea8n b\u00e0n ph\u00edm \u1ea3o.\n\n```yaml\n- hideKeyboard\n```\n\n### `openLink` / `deepLink`\n**M\u00f4 t\u1ea3**: M\u1edf Deep Link ho\u1eb7c URL quy \u0111\u1ecbnh.\n\n```yaml\n- openLink: \"myapp://settings/profile\"\n```\n\n### `navigate`\n**M\u00f4 t\u1ea3**: \u0110i\u1ec1u h\u01b0\u1edbng trang Web t\u1edbi URL m\u1edbi.\n\n```yaml\n- navigate: \"https://example.com/dashboard\"\n```\n\n---\n\n## \ud83d\udc46 Interaction & Input (T\u01b0\u01a1ng t\u00e1c & Nh\u1eadp li\u1ec7u)\n\n### `tapOn` / `tap`\n**M\u00f4 t\u1ea3**: Nh\u1ea5n (click) v\u00e0o ph\u1ea7n t\u1eed ho\u1eb7c t\u1ecda \u0111\u1ed9.\n\n```yaml\n- tap: \"Login\"\n\n- tap:\n    id: \"btn_submit\"\n    optional: true\n```\n\n### `longPressOn` / `longPress`\n**M\u00f4 t\u1ea3**: Nh\u1ea5n gi\u1eef ph\u1ea7n t\u1eed tr\u00ean m\u00e0n h\u00ecnh.\n\n```yaml\n- longPress:\n    text: \"Delete Item\"\n```\n\n### `doubleTapOn` / `doubleTap`\n**M\u00f4 t\u1ea3**: Nh\u1ea5n nhanh 2 l\u1ea7n li\u00ean ti\u1ebfp.\n\n```yaml\n- doubleTap:\n    id: \"photo_thumbnail\"\n```\n\n### `rightClick` / `contextClick`\n**M\u00f4 t\u1ea3**: Click chu\u1ed9t ph\u1ea3i (d\u00f9ng tr\u00ean Web, macOS, Windows).\n\n```yaml\n- rightClick:\n    text: \"File.txt\"\n```\n\n### `click`\n**M\u00f4 t\u1ea3**: L\u1ec7nh click \u0111\u01a1n gi\u1ea3n tr\u00ean Web.\n\n```yaml\n- click: \"Sign In\"\n```\n\n### `inputText` / `write` / `type`\n**M\u00f4 t\u1ea3**: Nh\u1eadp v\u0103n b\u1ea3n v\u00e0o \u00f4 \u0111ang focus ho\u1eb7c \u00f4 ch\u1ec9 \u0111\u1ecbnh.\n\n```yaml\n- inputText: \"user@example.com\"\n\n- write:\n    text: \"Xin ch\u00e0o\"\n    unicode: true\n```\n\n### `eraseText` / `clear`\n**M\u00f4 t\u1ea3**: X\u00f3a k\u00fd t\u1ef1 trong \u00f4 \u0111ang nh\u1eadp.\n\n```yaml\n- eraseText: 5 # X\u00f3a 5 k\u00fd t\u1ef1\n```\n\n### `tapAt` / `inputAt`\n**M\u00f4 t\u1ea3**: T\u01b0\u01a1ng t\u00e1c theo lo\u1ea1i ph\u1ea7n t\u1eed v\u00e0 th\u1ee9 t\u1ef1 index (Fallback khi kh\u00f4ng c\u00f3 ID/Text).\n\n```yaml\n- tapAt:\n    type: \"Button\"\n    index: 1\n\n- inputAt:\n    type: \"EditText\"\n    index: 0\n    text: \"admin@example.com\"\n```\n\n### `pasteText`\n**M\u00f4 t\u1ea3**: D\u00e1n n\u1ed9i dung clipboard v\u00e0o \u00f4 \u0111ang ch\u1ecdn.\n\n```yaml\n- pasteText\n```\n\n---\n\n## \ud83d\udcdc Scroll & Swipe (Cu\u1ed9n & Vu\u1ed1t)\n\n### `swipeLeft` / `swipeRight` / `swipeUp` / `swipeDown` / `swipe`\n**M\u00f4 t\u1ea3**: Vu\u1ed1t m\u00e0n h\u00ecnh theo h\u01b0\u1edbng ch\u1ec9 \u0111\u1ecbnh.\n\n```yaml\n- swipeLeft\n\n- swipe:\n    direction: \"up\"\n    distance: 0.8\n    duration: 500\n```\n\n### `scrollUntilVisible` / `scrollTo`\n**M\u00f4 t\u1ea3**: Cu\u1ed9n m\u00e0n h\u00ecnh li\u00ean t\u1ee5c cho \u0111\u1ebfn khi th\u1ea5y ph\u1ea7n t\u1eed m\u1ee5c ti\u00eau xu\u1ea5t hi\u1ec7n.\n\n```yaml\n- scrollTo: \"Bottom Link\"\n\n- scrollUntilVisible:\n    id: \"target_card\"\n    direction: \"down\"\n    maxScrolls: 15\n```\n\n---\n\n## \ud83d\udc41\ufe0f Assertions & Visibility (Ki\u1ec3m tra giao di\u1ec7n)\n\n### `assertVisible` / `see`\n**M\u00f4 t\u1ea3**: Ki\u1ec3m tra ph\u1ea7n t\u1eed hi\u1ec3n th\u1ecb tr\u00ean m\u00e0n h\u00ecnh.\n\n```yaml\n- see: \"Welcome Back\"\n\n- assertVisible:\n    id: \"header_title\"\n    soft: true # Kh\u00f4ng d\u1eebng test khi kh\u00f4ng th\u1ea5y\n```\n\n### `assertNotVisible` / `notSee`\n**M\u00f4 t\u1ea3**: Ki\u1ec3m tra ph\u1ea7n t\u1eed KH\u00d4NG xu\u1ea5t hi\u1ec7n tr\u00ean m\u00e0n h\u00ecnh.\n\n```yaml\n- notSee: \"Error Message\"\n```\n\n### `waitUntilVisible` / `waitSee`\n**M\u00f4 t\u1ea3**: Ch\u1edd cho \u0111\u1ebfn khi ph\u1ea7n t\u1eed xu\u1ea5t hi\u1ec7n.\n\n```yaml\n- waitSee:\n    id: \"dashboard_loaded\"\n    timeout: 10000\n```\n\n### `waitUntilNotVisible` / `waitNotSee`\n**M\u00f4 t\u1ea3**: Ch\u1edd cho \u0111\u1ebfn khi ph\u1ea7n t\u1eed bi\u1ebfn m\u1ea5t (VD: Loading overlay).\n\n```yaml\n- waitNotSee: \"Loading...\"\n```\n\n### `extendedWaitUntil`\n**M\u00f4 t\u1ea3**: Ch\u1edd nhi\u1ec1u \u0111i\u1ec1u ki\u1ec7n visible / notVisible c\u00f9ng l\u00fac.\n\n```yaml\n- extendedWaitUntil:\n    timeout: 15000\n    visible:\n      id: \"success_dialog\"\n    notVisible:\n      id: \"spinner\"\n```\n\n### `assertColor` / `checkColor`\n**M\u00f4 t\u1ea3**: Ki\u1ec3m tra m\u00e0u pixel t\u1ea1i t\u1ecda \u0111\u1ed9 ch\u1ec9 \u0111\u1ecbnh.\n\n```yaml\n- assertColor:\n    point: \"50%,50%\"\n    color: \"#00FF00\"\n    tolerance: 5\n```\n\n### `assertScreenshot`\n**M\u00f4 t\u1ea3**: So s\u00e1nh \u1ea3nh m\u00e0n h\u00ecnh hi\u1ec7n t\u1ea1i v\u1edbi \u1ea3nh m\u1eabu baseline.\n\n```yaml\n- assertScreenshot: \"baselines/home.png\"\n```\n\n### `assertClipboard`\n**M\u00f4 t\u1ea3**: Ki\u1ec3m tra n\u1ed9i dung clipboard.\n\n```yaml\n- assertClipboard: \"Copied Token\"\n```\n\n---\n\n## \u23f3 Wait & Delays (T\u1ea1m d\u1eebng)\n\n### `wait` / `await`\n**M\u00f4 t\u1ea3**: T\u1ea1m d\u1eebng c\u1ed1 \u0111\u1ecbnh kho\u1ea3ng th\u1eddi gian (ms).\n\n```yaml\n- wait: 2000 # T\u1ea1m d\u1eebng 2s\n```\n\n### `waitForAnimationToEnd`\n**M\u00f4 t\u1ea3**: Ch\u1edd hi\u1ec7u \u1ee9ng chuy\u1ec3n c\u1ea3nh \u1ed5n \u0111\u1ecbnh.\n\n```yaml\n- waitForAnimationToEnd\n```\n\n---\n\n## \ud83d\udce6 Variables & Selectors (Bi\u1ebfn & B\u1ed9 ch\u1ecdn t\u00e1i s\u1eed d\u1ee5ng)\n\n### `find` / `define`\n**M\u00f4 t\u1ea3**: \u0110\u1ecbnh ngh\u0129a b\u1ed9 ch\u1ecdn selector v\u00e0 g\u00e1n t\u00ean bi\u1ebfn \u0111\u1ec3 t\u00e1i s\u1eed d\u1ee5ng.\n\n```yaml\n- find:\n    name: \"submit_btn\"\n    id: \"btn_submit\"\n\n- tap: \"${submit_btn}\"\n```\n\n### `setVar`\n**M\u00f4 t\u1ea3**: G\u00e1n gi\u00e1 tr\u1ecb v\u00e0o bi\u1ebfn.\n\n```yaml\n- setVar:\n    name: \"user_name\"\n    value: \"John Doe\"\n```\n\n### `assertVar`\n**M\u00f4 t\u1ea3**: Ki\u1ec3m tra gi\u00e1 tr\u1ecb bi\u1ebfn.\n\n```yaml\n- assertVar:\n    name: \"user_name\"\n    equals: \"John Doe\"\n```\n\n### `generate`\n**M\u00f4 t\u1ea3**: Sinh d\u1eef li\u1ec7u ng\u1eabu nhi\u00ean (Faker) v\u00e0 l\u01b0u v\u00e0o bi\u1ebfn.\n\n```yaml\n- generate:\n    name: \"random_email\"\n    type: \"email\" # uuid, email, phone, name, address, number, date\n```\n\n---\n\n## \ud83d\udd00 Control Flow & Logic (Lu\u1ed3ng \u0111i\u1ec1u khi\u1ec3n)\n\n### `repeat`\n**M\u00f4 t\u1ea3**: V\u00f2ng l\u1eb7p th\u1ef1c thi danh s\u00e1ch l\u1ec7nh.\n\n```yaml\n- repeat:\n    times: 3\n    commands:\n      - tap: \"Next\"\n      - wait: 500\n```\n\n### `retry`\n**M\u00f4 t\u1ea3**: Th\u1eed l\u1ea1i kh\u1ed1i l\u1ec7nh n\u1ebfu x\u1ea3y ra l\u1ed7i.\n\n```yaml\n- retry:\n    maxRetries: 3\n    commands:\n      - tap: \"Submit\"\n      - see: \"Success\"\n```\n\n### `runFlow`\n**M\u00f4 t\u1ea3**: Ch\u1ea1y file test sub-flow YAML kh\u00e1c.\n\n```yaml\n- runFlow:\n    path: \"./common/login.yaml\"\n    vars:\n      user: \"admin\"\n```\n\n### `conditional`\n**M\u00f4 t\u1ea3**: C\u1ea5u tr\u00fac r\u1ebd nh\u00e1nh If / Then / Else theo ph\u1ea7n t\u1eed UI.\n\n```yaml\n- conditional:\n    condition:\n      visible: \"Update Available\"\n    then:\n      - tap: \"Skip\"\n    else:\n      - log: \"No update popup\"\n```\n\n---\n\n## \ud83d\udc0d Scripting & Python Integration (T\u00edch h\u1ee3p Script & Python)\n\n### `runPython` / `execPython` / `python`\n**M\u00f4 t\u1ea3**: Th\u1ef1c thi file Python ho\u1eb7c \u0111o\u1ea1n m\u00e3 Python inline, truy\u1ec1n tham s\u1ed1 v\u00e0 l\u01b0u bi\u1ebfn k\u1ebft qu\u1ea3 v\u00e0o context test flow.\n\n```yaml\n- runPython:\n    code: |\n      import sys\n      print(\"Calculated token: ABC123XYZ\")\n    saveVar: \"auth_token\"\n\n- runPython:\n    script: \"./scripts/helper.py\"\n    args: [\"--mode\", \"test\"]\n    saveVars:\n      output_code: \"status_code\"\n      output_msg: \"status_msg\"\n```\n\n### `runScript`\n**M\u00f4 t\u1ea3**: Th\u1ef1c thi l\u1ec7nh Shell script tr\u00ean m\u00e1y Host.\n\n```yaml\n- runScript:\n    command: \"python3\"\n    args: [\"process.py\"]\n    saveOutput: \"script_result\"\n```\n\n### `evalScript`\n**M\u00f4 t\u1ea3**: Th\u1ef1c thi m\u00e3 JavaScript \u0111\u1ec3 t\u00ednh to\u00e1n bi\u1ec3u th\u1ee9c.\n\n```yaml\n- evalScript: \"Date.now()\"\n```\n\n### `assertTrue` / `assert`\n**M\u00f4 t\u1ea3**: Ki\u1ec3m tra bi\u1ec3u th\u1ee9c \u0111i\u1ec1u ki\u1ec7n logic.\n\n```yaml\n- assertTrue: \"${status_code} == 200\"\n```\n\n---\n\n## \ud83c\udf10 Network & Database (M\u1ea1ng & C\u01a1 s\u1edf d\u1eef li\u1ec7u)\n\n### `httpRequest`\n**M\u00f4 t\u1ea3**: G\u1eedi HTTP REST API request.\n\n```yaml\n- httpRequest:\n    url: \"https://api.example.com/login\"\n    method: \"POST\"\n    headers:\n      Content-Type: \"application/json\"\n    body:\n      username: \"admin\"\n    saveResponse:\n      \"$.data.token\": \"api_token\"\n```\n\n### `setNetwork`\n**M\u00f4 t\u1ea3**: B\u1eadt/t\u1eaft WiFi ho\u1eb7c Mobile Data tr\u00ean Android.\n\n```yaml\n- setNetwork:\n    wifi: true\n    data: false\n```\n\n### `airplaneMode` / `toggleAirplaneMode`\n**M\u00f4 t\u1ea3**: B\u1eadt/T\u1eaft ch\u1ebf \u0111\u1ed9 m\u00e1y bay.\n\n```yaml\n- airplaneMode\n```\n\n### `dbQuery`\n**M\u00f4 t\u1ea3**: Th\u1ef1c hi\u1ec7n truy v\u1ea5n SQL v\u00e0o c\u01a1 s\u1edf d\u1eef li\u1ec7u.\n\n```yaml\n- dbQuery:\n    connection: \"postgres://user:pass@localhost:5432/db\"\n    query: \"SELECT status FROM users WHERE id = ?\"\n    params: [\"123\"]\n    save:\n      \"status\": \"user_status\"\n```\n\n---\n\n## \ud83d\udccb Clipboard & Files (Clipboard & Qu\u1ea3n l\u00fd File)\n\n### `setClipboard` / `getClipboard` / `assertClipboard` / `copyTextFrom` / `pasteText`\n```yaml\n- setClipboard: \"SecretOTP123\"\n\n- getClipboard: \"my_copied_code\"\n\n- copyTextFrom:\n    id: \"otp_label\"\n\n- pasteText\n```\n\n### `pushFile` / `pullFile`\n**M\u00f4 t\u1ea3**: Truy\u1ec1n file gi\u1eefa m\u00e1y Host v\u00e0 thi\u1ebft b\u1ecb Android.\n\n```yaml\n- pushFile:\n    source: \"./config.json\"\n    destination: \"/sdcard/config.json\"\n\n- pullFile:\n    source: \"/sdcard/log.txt\"\n    destination: \"./output/log.txt\"\n```\n\n---\n\n## \ud83d\udcf8 Artifacts & Reporting (B\u00e1o c\u00e1o & \u1ea2nh ch\u1ee5p)\n\n### `screenshot` / `takeScreenshot` / `snapshot`\n**M\u00f4 t\u1ea3**: Ch\u1ee5p \u1ea3nh m\u00e0n h\u00ecnh thi\u1ebft b\u1ecb.\n\n```yaml\n- screenshot: \"login_screen.png\"\n```\n\n### `startRecording` / `stopRecording`\n**M\u00f4 t\u1ea3**: Quay video m\u00e0n h\u00ecnh ki\u1ec3m th\u1eed.\n\n```yaml\n- startRecording: \"test_run.mp4\"\n- wait: 5000\n- stopRecording\n```\n\n### `exportReport`\n**M\u00f4 t\u1ea3**: Xu\u1ea5t b\u00e1o c\u00e1o k\u1ebft qu\u1ea3 ra \u0111\u1ecbnh d\u1ea1ng HTML / JSON.\n\n```yaml\n- exportReport:\n    path: \"./output/report.json\"\n    format: \"json\"\n```\n\n### `sendLarkMessage` / `lark`\n**M\u00f4 t\u1ea3**: G\u1eedi th\u00f4ng b\u00e1o k\u1ebft qu\u1ea3 qua Lark / Feishu Bot.\n\n```yaml\n- lark:\n    webhook: \"https://open.larksuite.com/open-apis/bot/v2/hook/xxx\"\n    title: \"K\u1ebft qu\u1ea3 ki\u1ec3m th\u1eed\"\n    content: \"Test suite ch\u1ea1y ho\u00e0n t\u1ea5t th\u00e0nh c\u00f4ng!\"\n    status: \"success\"\n```\n\n---\n\n## \ud83d\udccd Location & GPS Simulation (Gi\u1ea3 l\u1eadp v\u1ecb tr\u00ed GPS)\n\n### `mockLocation` / `gps`\n**M\u00f4 t\u1ea3**: Ph\u00e1t di chuy\u1ec3n v\u1ecb tr\u00ed GPS gi\u1ea3 l\u1eadp theo tuy\u1ebfn \u0111\u01b0\u1eddng file GPX/KML.\n\n```yaml\n- gps:\n    file: \"./routes/hanoi_drive.gpx\"\n    speed: 50 # km/h\n    loop: true\n```\n\n### `stopMockLocation` / `mockLocationControl`\n```yaml\n- mockLocationControl:\n    speed: 80\n    pause: false\n\n- stopMockLocation\n```\n\n### `waitForLocation` / `waitForMockCompletion`\n```yaml\n- waitForLocation:\n    lat: 21.0278\n    lon: 105.8342\n    tolerance: 15.0\n\n- waitForMockCompletion: 60000\n```\n\n---\n\n## \ud83c\udfac GIF Recording (T\u1ea1o GIF minh h\u1ecda)\n\n### `captureGifFrame` / `startGifCapture` / `stopGifCapture` / `buildGif`\n```yaml\n- captureGifFrame: \"step1\"\n- tap: \"Next\"\n- captureGifFrame: \"step2\"\n- buildGif:\n    frames: [\"step1\", \"step2\"]\n    output: \"result.gif\"\n    delay: 500\n```\n\n---\n\n## \u2699\ufe0f Hardware Jig Controller (\u0110i\u1ec1u khi\u1ec3n Ph\u1ea7n c\u1ee9ng Jig STM32/Relay/Servo)\n\nLumi Tester h\u1ed7 tr\u1ee3 giao ti\u1ebfp tr\u1ef1c ti\u1ebfp qua C\u1ed5ng COM/TTY t\u1edbi m\u1ea1ch n\u1ea1p v\u00e0 b\u1ed9 Jig \u0111i\u1ec1u khi\u1ec3n ph\u1ea7n c\u1ee9ng t\u1ef1 \u0111\u1ed9ng h\u00f3a cho thi\u1ebft b\u1ecb IoT / Smart Home.\n\n### `connectJig` / `disconnectJig`\n**M\u00f4 t\u1ea3**: K\u1ebft n\u1ed1i t\u1edbi m\u1ea1ch ph\u1ea7n c\u1ee9ng Jig Controller qua c\u1ed5ng RS232/USB Serial.\n\n```yaml\n- connectJig: \"COM5\"\n\n# Ho\u1eb7c b\u1eb1ng c\u1ea5u h\u00ecnh \u0111\u1ed1i t\u01b0\u1ee3ng\n- connectJig:\n    port: \"COM5\"\n    baudrate: 115200\n    timeoutMs: 3000\n```\n\n### `turnOn` / `turnOff` / `turnOffAll` / `powerCycle`\n**M\u00f4 t\u1ea3**: \u0110i\u1ec1u khi\u1ec3n \u0111\u00f3ng/ng\u1eaft c\u00e1c k\u00eanh R\u01a1-le (Relay) c\u1ea5p ngu\u1ed3n ph\u1ea7n c\u1ee9ng.\n\n```yaml\n- turnOn: 1       # B\u1eadt ngu\u1ed3n k\u00eanh 1\n- turnOff: 1      # T\u1eaft ngu\u1ed3n k\u00eanh 1\n- turnOffAll      # T\u1eaft to\u00e0n b\u1ed9 r\u01a1-le\n- powerCycle:     # Kh\u1edfi \u0111\u1ed9ng l\u1ea1i ngu\u1ed3n (T\u1eaft 2s r\u1ed3i b\u1eadt l\u1ea1i)\n    channel: 1\n    offMs: 2000\n```\n\n### `clickButton` / `pressButton` / `holdButton` / `releaseButton` / `releaseAllButtons` / `repeatClick`\n**M\u00f4 t\u1ea3**: \u0110i\u1ec1u khi\u1ec3n \u0111\u1ed9ng c\u01a1 Servo nh\u1ea5n n\u00fat v\u1eadt l\u00fd tr\u00ean thi\u1ebft b\u1ecb.\n\n```yaml\n- clickButton: 1         # Click n\u00fat v\u1eadt l\u00fd k\u00eanh 1\n- pressButton: 1         # Nh\u1ea5n \u0111\u00e8 n\u00fat k\u00eanh 1\n- holdButton: 1          # Nh\u1ea5n gi\u1eef n\u00fat (cho ch\u1ebf \u0111\u1ed9 Pairing / Reset)\n- releaseButton: 1       # Nh\u1ea3 n\u00fat k\u00eanh 1\n- releaseAllButtons      # Nh\u1ea3 t\u1ea5t c\u1ea3 c\u00e1c n\u00fat v\u1ec1 v\u1ecb tr\u00ed ngh\u1ec9\n- repeatClick:           # Nh\u1ea5n nh\u1ea5p nh\u1ea3 3 l\u1ea7n li\u00ean ti\u1ebfp\n    channel: 1\n    count: 3\n```\n\n### `rotateServo` / `configureServo` / `startRepeatClick` / `stopRepeatClick`\n**M\u00f4 t\u1ea3**: C\u1ea5u h\u00ecnh g\u00f3c xoay Servo chi ti\u1ebft v\u00e0 \u0111i\u1ec1u khi\u1ec3n v\u00f2ng l\u1eb7p nh\u1ea5n nh\u1ea3 t\u1ef1 \u0111\u1ed9ng ph\u1ea7n c\u1ee9ng tr\u00ean STM32.\n\n```yaml\n- rotateServo:\n    channel: 1\n    angle: 90\n    speed: 50\n\n- configureServo:\n    channel: 1\n    pressAngle: 75\n    releaseAngle: 0\n    pressDurationMs: 200\n\n- startRepeatClick:\n    channel: 1\n    periodMs: 1500\n\n- stopRepeatClick: 1\n```\n\n### `readServo` / `readRelay`\n**M\u00f4 t\u1ea3**: \u0110\u1ecdc tr\u1ea1ng th\u00e1i ph\u1ea3n h\u1ed3i t\u1eeb Servo v\u00e0 Relay.\n\n```yaml\n- readServo: 1\n- readRelay: 1\n```\n\n---\n\n## \ud83c\udfa8 Hardware LED & Color Sensor (C\u1ea3m bi\u1ebfn m\u00e0u & LED Ph\u1ea7n c\u1ee9ng)\n\n### `seeLedColor` / `seeLedBlink` / `seeLedOff`\n**M\u00f4 t\u1ea3**: Ki\u1ec3m tra v\u00e0 \u0111\u1ee3i tr\u1ea1ng th\u00e1i \u0111\u00e8n LED ph\u1ea7n c\u1ee9ng (RED, GREEN, BLUE, YELLOW, CYAN, MAGENTA, PINK, WHITE, OFF).\n\n```yaml\n- seeLedColor: \"GREEN\"\n\n- seeLedColor:\n    channel: 1\n    expected: \"BLUE\"\n    timeoutMs: 5000\n\n- seeLedBlink: 1 # \u0110\u1ee3i LED k\u00eanh 1 nh\u1ea5p nh\u00e1y\n\n- seeLedOff: 1   # \u0110\u1ee3i LED t\u1eaft\n```\n\n### `setSensorLight` / `setBrightnessThresholds` / `waitForBrightness` / `waitForCct`\n**M\u00f4 t\u1ea3**: \u0110i\u1ec1u khi\u1ec3n \u0111\u00e8n chi\u1ebfu c\u1ea3m bi\u1ebfn m\u00e0u v\u00e0 c\u00e0i \u0111\u1eb7t ng\u01b0\u1ee1ng \u0111\u1ed9 s\u00e1ng / nhi\u1ec7t \u0111\u1ed9 m\u00e0u (CCT Kelvin).\n\n```yaml\n- setSensorLight: \"on\"\n\n- setBrightnessThresholds:\n    channel: 1\n    offBelowPercent: 30\n    onAbovePercent: 70\n\n- waitForBrightness:\n    channel: 1\n    minPercent: 70\n\n- waitForCct:\n    channel: 1\n    minKelvin: 2700\n    maxKelvin: 6500\n```\n\n### `calibrateColor` / `calibrateBrightness` / `addCctPoint` / `saveCalibration` / `loadCalibration` / `resetCalibration` / `eraseCalibration`\n**M\u00f4 t\u1ea3**: Hi\u1ec7u ch\u1ec9nh v\u00e0 l\u01b0u tr\u1eef d\u1eef li\u1ec7u c\u00e2n b\u1eb1ng tr\u1eafng / m\u00e0u s\u1eafc c\u1ea3m bi\u1ebfn v\u00e0o b\u1ed9 nh\u1edb Flash.\n\n```yaml\n- calibrateColor:\n    channel: 1\n    color: \"RED\"\n\n- saveCalibration\n- loadCalibration\n```\n\n### `enterSafeState` / `systemDiagnostics` / `readColor` / `readSensorLight`\n**M\u00f4 t\u1ea3**: Ng\u1eaft an to\u00e0n kh\u1ea9n c\u1ea5p, ch\u1ea9n \u0111o\u00e1n h\u1ec7 th\u1ed1ng MCU v\u00e0 \u0111\u1ecdc gi\u00e1 tr\u1ecb m\u00e0u RGBC th\u1ef1c t\u1ebf.\n\n```yaml\n- enterSafeState\n- systemDiagnostics\n- readColor: 1\n- readSensorLight\n```\n\n---\n\n## \ud83d\udcf7 Camera Profile Assertions (Ki\u1ec3m tra tr\u1ea1ng th\u00e1i qua Camera)\n\n### `assertDeviceState` / `waitDeviceState` / `assertDeviceTransition` / `waitLedPattern` / `getDeviceState`\n**M\u00f4 t\u1ea3**: Nh\u1eadn di\u1ec7n v\u00f9ng \u0111\u00e8n LED thi\u1ebft b\u1ecb qua Camera profile.\n\n```yaml\n- assertDeviceState:\n    button: \"power_led\"\n    expect: \"GREEN\"\n\n- waitDeviceState:\n    button: \"status_led\"\n    expect: \"BLUE\"\n    withinMs: 5000\n\n- assertDeviceTransition:\n    button: \"status_led\"\n    from: \"OFF\"\n    to: \"RED\"\n\n- waitLedPattern:\n    button: \"status_led\"\n    expect: \"PINK\"\n    count: 3\n\n- getDeviceState:\n    saveAs: \"current_device_leds\"\n```\n\n---\n\n## \ud83d\udd0a Audio & Media Playback (\u00c2m thanh & Truy\u1ec1n th\u00f4ng)\n\n### `playMedia` / `stopMedia`\n**M\u00f4 t\u1ea3**: Ph\u00e1t file \u00e2m thanh m\u1eabu (.wav, .mp3) ra loa thi\u1ebft b\u1ecb.\n\n```yaml\n- playMedia:\n    file: \"./audio/voice_command.wav\"\n    loopPlayback: false\n\n- stopMedia\n```\n\n### `startAudioCapture` / `stopAudioCapture` / `verifyAudioDucking`\n**M\u00f4 t\u1ea3**: Ghi \u00e2m t\u00edn hi\u1ec7u mic v\u00e0 ki\u1ec3m tra hi\u1ec7n t\u01b0\u1ee3ng gi\u1ea3m \u00e2m l\u01b0\u1ee3ng (Audio Ducking).\n\n```yaml\n- startAudioCapture:\n    duration: 10000\n\n- stopAudioCapture\n\n- verifyAudioDucking:\n    minDuckingCount: 1\n    volumeDropThreshold: 0.3\n```\n\n---\n\n## \ud83d\udee0\ufe0f Device & System Settings (Thi\u1ebft l\u1eadp Thi\u1ebft b\u1ecb & H\u1ec7 th\u1ed1ng)\n\n### `rotate` / `setOrientation`\n**M\u00f4 t\u1ea3**: Xoay m\u00e0n h\u00ecnh thi\u1ebft b\u1ecb.\n\n```yaml\n- rotate: \"landscape\"\n\n- setOrientation: \"LANDSCAPE\"\n```\n\n### `press` / `pressKey`\n**M\u00f4 t\u1ea3**: Nh\u1ea5n ph\u00edm c\u1ee9ng ho\u1eb7c ph\u00edm h\u1ec7 th\u1ed1ng (ENTER, BACK, HOME, VOLUME_UP, DPAD_CENTER).\n\n```yaml\n- press: \"ENTER\"\n\n- pressKey:\n    key: \"BACK\"\n    times: 2\n```\n\n### Random Inputs: `inputRandomEmail` / `inputRandomNumber` / `inputRandomPersonName` / `inputRandomText`\n**M\u00f4 t\u1ea3**: Nh\u1eadp ng\u1eabu nhi\u00ean d\u1eef li\u1ec7u v\u00e0o \u00f4 \u0111ang ch\u1ecdn.\n\n```yaml\n- inputRandomEmail\n- inputRandomNumber: { length: 6 }\n- inputRandomPersonName\n- inputRandomText: { length: 10 }\n```\n\n### System Controls: `openNotifications` / `openQuickSettings` / `setVolume` / `lockDevice` / `unlockDevice` / `selectDisplay` / `setLocale`\n```yaml\n- openNotifications\n- openQuickSettings\n- setVolume: 80\n- lockDevice\n- unlockDevice\n- display: 1\n- locale: \"vi_VN\"\n```\n\n### Performance Profiling: `startProfiling` / `stopProfiling` / `assertPerformance` / `setCpuThrottling` / `setNetworkConditions`\n```yaml\n- startProfiling\n- wait: 10000\n- stopProfiling:\n    savePath: \"./output/profile.trace\"\n\n- assertPerformance:\n    metric: \"memory\"\n    limit: \"250MB\"\n\n- setCpuThrottling: 4.0\n\n- setNetworkConditions: \"slow-3g\"\n```\n", "python_integration": "# Python Integration Guide for Lumi Tester\n\nLumi Tester provides native support for executing Python scripts and inline Python snippets directly inside YAML flows using `runPython` (aliases: `execPython`, `python`).\n\nThis feature enables seamless integration with external APIs, custom database queries, hardware test logic, AI model inference, and data extraction.\n\n---\n\n## \ud83d\ude80 Quick Example\n\n```yaml\nplatform: android\nappId: com.example.app\n---\n# 1. Simple shorthand execution\n- runPython: \"./scripts/pre_check.py\"\n\n# 2. Execute script with arguments and extract multiple JSON variables\n- runPython:\n    script: \"./scripts/authenticate.py\"\n    args:\n      - \"--device\"\n      - \"$DEVICE_SERIAL\"\n      - \"--env\"\n      - \"staging\"\n    env:\n      SECRET_KEY: \"my_api_secret\"\n    timeoutMs: 15000\n    saveVars:\n      access_token: \"token\"\n      user_status: \"user.status\"\n\n# 3. Use extracted variables in app flow\n- tap:\n    id: \"token_input\"\n- inputText: \"$access_token\"\n\n# 4. Run inline Python code\n- runPython:\n    code: |\n      import sys, json\n      print(json.dumps({\"status\": \"PASS\", \"received_token\": sys.argv[1]}))\n    args: [\"$access_token\"]\n    saveVar: \"result_json\"\n```\n\n---\n\n## \u2699\ufe0f Command Reference (`runPython` / `execPython` / `python`)\n\n| Parameter | Type | Required | Description |\n| :--- | :--- | :--- | :--- |\n| `script` | `string` | Optional* | Path to `.py` script file relative to flow directory. |\n| `code` | `string` | Optional* | Inline Python source code snippet to execute. |\n| `args` | `list<string>` | Optional | Arguments passed to the script (sys.argv). Supports variable substitution (`$VAR`). |\n| `env` | `map<string, string>` | Optional | Custom environment variables passed to the Python process. |\n| `timeoutMs` | `number` | Optional | Execution timeout in milliseconds (default: `30000` / 30s). |\n| `pythonPath` | `string` | Optional | Custom Python interpreter binary (e.g. `python3`, `python`, or `./venv/bin/python`). |\n| `saveVar` | `string` | Optional | Variable name to store trimmed `stdout` text output. |\n| `saveVars` | `list` \\| `map` | Optional | Extract multiple variables from `stdout` JSON output. |\n\n*\\* Either `script` or `code` must be specified when using object format.*\n\n---\n\n## \ud83d\udce6 Variable Extraction (`saveVar` & `saveVars`)\n\n### 1. `saveVar` (Single String Output)\nStores the complete trimmed `stdout` text into a single variable.\n\n```yaml\n- runPython:\n    code: \"print('GENERATED_TOKEN_12345')\"\n    saveVar: \"my_token\"\n\n- inputText: \"$my_token\"\n```\n\n### 2. `saveVars` with List (Direct Key Extraction)\nWhen Python prints a JSON dictionary, extract fields directly into matching variable names:\n\n```yaml\n- runPython:\n    code: |\n      import json\n      print(json.dumps({\"token\": \"abc123\", \"user_id\": 999}))\n    saveVars:\n      - token\n      - user_id\n\n# Creates variables: $token = \"abc123\", $user_id = \"999\"\n```\n\n### 3. `saveVars` with Map (Custom Variable Mapping & Dot Notation)\nMap variable names to specific JSON fields or nested properties using dot notation:\n\n```yaml\n- runPython:\n    code: |\n      import json\n      print(json.dumps({\n        \"status\": \"success\",\n        \"data\": {\n          \"session_token\": \"xyz789\",\n          \"user\": { \"role\": \"admin\" }\n        }\n      }))\n    saveVars:\n      sessionToken: \"data.session_token\"\n      userRole: \"data.user.role\"\n\n# Creates variables: $sessionToken = \"xyz789\", $userRole = \"admin\"\n```\n\n---\n\n## \ud83d\udc0d Python Environment Resolution\n\nLumi Tester automatically resolves the Python interpreter in the following order:\n\n1. `pythonPath` specified in the `runPython` command parameters.\n2. System default: `python` on Windows, `python3` on macOS / Linux.\n3. Virtualenv paths if specified (e.g., `pythonPath: \"./.venv/bin/python\"` or `pythonPath: \".\\\\.venv\\\\Scripts\\\\python.exe\"`).\n\n---\n\n## \ud83d\udee0 Troubleshooting\n\n- **Non-zero Exit Codes**: If the Python script exits with code `!= 0`, Lumi Tester logs `stderr` output and fails the step.\n- **JSON Parsing Errors**: When using `saveVars`, ensure the script prints clean JSON to `stdout` without extraneous debug `print()` statements.\n", "flows": "# Lu\u1ed3ng th\u1ef1c thi Test (Test Execution Flow)\n\nT\u00e0i li\u1ec7u n\u00e0y gi\u1ea3i th\u00edch chi ti\u1ebft c\u00e1ch Lumi Tester \u0111i\u1ec1u ph\u1ed1i m\u1ed9t phi\u00ean ki\u1ec3m th\u1eed, t\u1eeb vi\u1ec7c t\u1ea3i c\u1ea5u h\u00ecnh \u0111\u1ebfn khi t\u1ea1o b\u00e1o c\u00e1o.\n\n## V\u00f2ng \u0111\u1eddi c\u1ea5p cao (Lifecycle)\n\nQu\u00e1 tr\u00ecnh th\u1ef1c thi tu\u00e2n theo m\u1ed9t v\u00f2ng \u0111\u1eddi nghi\u00eam ng\u1eb7t \u0111\u1ec3 \u0111\u1ea3m b\u1ea3o t\u00ednh nh\u1ea5t qu\u00e1n v\u00e0 c\u00f4 l\u1eadp gi\u1eefa c\u00e1c b\u00e0i test.\n\n```mermaid\ngraph TD\n    Start((B\u1eaft \u0111\u1ea7u)) --> LoadConfig[T\u1ea3i C\u1ea5u h\u00ecnh & Thi\u1ebft b\u1ecb]\n    LoadConfig --> Session[Kh\u1edfi t\u1ea1o Session]\n    \n    subgraph Execution Loop [V\u00f2ng l\u1eb7p Th\u1ef1c thi]\n        Session --> Setup{C\u00f3 Setup kh\u00f4ng?}\n        Setup -- C\u00f3 --> RunSetup[Ch\u1ea1y Setup Flow]\n        RunSetup --> RunMain\n        Setup -- Kh\u00f4ng --> RunMain[Ch\u1ea1y Test Ch\u00ednh]\n        \n        RunMain --> Teardown{C\u00f3 Teardown kh\u00f4ng?}\n        Teardown -- C\u00f3 --> RunTeardown[Ch\u1ea1y Teardown Flow]\n        Teardown -- Kh\u00f4ng --> Next{C\u00f2n file n\u00e0o kh\u00f4ng?}\n        \n        RunTeardown --> Next\n    end\n    \n    Next -- C\u00f3 --> Session\n    Next -- Kh\u00f4ng --> Report[T\u1ea1o B\u00e1o c\u00e1o]\n    Report --> End((K\u1ebft th\u00fac))\n```\n\n### C\u00e1c th\u00e0nh ph\u1ea7n c\u1ee7a Flow\n- **Setup (`setup.yaml`)**: Ch\u1ea1y **tr\u01b0\u1edbc** m\u1ed7i file test. L\u00fd t\u01b0\u1edfng \u0111\u1ec3 m\u1edf app, \u0111\u0103ng nh\u1eadp, ho\u1eb7c reset tr\u1ea1ng th\u00e1i.\n- **Main Flow**: K\u1ecbch b\u1ea3n test nghi\u1ec7p v\u1ee5 ch\u00ednh.\n- **Teardown (`teardown.yaml`)**: Ch\u1ea1y **sau** m\u1ed7i file test, b\u1ea5t k\u1ec3 th\u00e0nh c\u00f4ng hay th\u1ea5t b\u1ea1i. D\u00f9ng \u0111\u1ec3 \u0111\u00f3ng app ho\u1eb7c x\u00f3a d\u1eef li\u1ec7u test.\n\n## Quy tr\u00ecnh x\u1eed l\u00fd l\u1ec7nh n\u1ed9i b\u1ed9\n\nKhi m\u1ed9t l\u1ec7nh (v\u00ed d\u1ee5: `tap: \"Login\"`) \u0111\u01b0\u1ee3c th\u1ef1c thi, n\u00f3 \u0111i qua \u0111\u01b0\u1eddng \u1ed1ng (pipeline) sau:\n\n1.  **Parsing**: D\u00f2ng YAML \u0111\u01b0\u1ee3c chuy\u1ec3n \u0111\u1ed5i th\u00e0nh c\u1ea5u tr\u00fac `Command` trong m\u00f4i tr\u01b0\u1eddng Rust.\n2.  **Resolution**: C\u00e1c bi\u1ebfn (`${VAR}`) \u0111\u01b0\u1ee3c gi\u1ea3i quy\u1ebft (thay th\u1ebf) t\u1eeb state hi\u1ec7n t\u1ea1i.\n3.  **Driver Dispatch**: Runner g\u1ecdi ph\u01b0\u01a1ng th\u1ee9c trait t\u01b0\u01a1ng \u1ee9ng c\u1ee7a driver (v\u00ed d\u1ee5: `driver.tap()`).\n4.  **Chi\u1ebfn l\u01b0\u1ee3c Selector**:\n    - Driver l\u1ea5y c\u00e2y ph\u00e2n c\u1ea5p UI (Hierarchy) m\u1edbi nh\u1ea5t.\n    - N\u1ebfu selector c\u1ee5 th\u1ec3 (ID, XPath) \u0111\u01b0\u1ee3c cung c\u1ea5p, n\u00f3 t\u00ecm ki\u1ebfm tr\u1ef1c ti\u1ebfp.\n    - N\u1ebfu ch\u1ec9 c\u00f3 chu\u1ed7i v\u0103n b\u1ea3n (\"Login\"), n\u00f3 d\u00f9ng c\u01a1 ch\u1ebf **Smart Selector** \u0111\u1ec3 t\u00ecm element kh\u1edbp v\u1edbi Text, Content Description, ho\u1eb7c Resource ID (c\u00f3 ch\u1ea5m \u0111i\u1ec3m \u0111\u1ed9 ph\u00f9 h\u1ee3p).\n5.  **Action**: Driver th\u1ef1c hi\u1ec7n h\u00e0nh \u0111\u1ed9ng v\u1eadt l\u00fd (g\u1eedi s\u1ef1 ki\u1ec7n c\u1ea3m \u1ee9ng, ph\u00edm b\u1ea5m).\n6.  **Verification**: \u0110\u1ed1i v\u1edbi c\u00e1c l\u1ec7nh assertion (.e.g `see`, `assertVisible`), driver s\u1ebd x\u00e1c minh tr\u1ea1ng th\u00e1i m\u00e0n h\u00ecnh so v\u1edbi k\u1ef3 v\u1ecdng.\n\n## X\u1eed l\u00fd l\u1ed7i (Failure Handling)\n\nN\u1ebfu m\u1ed9t b\u01b0\u1edbc g\u1eb7p l\u1ed7i trong qu\u00e1 tr\u00ecnh ch\u1ea1y:\n1.  **Ch\u1ee5p m\u00e0n h\u00ecnh**: M\u1ed9t \u1ea3nh screenshot l\u1ed7i (`fail_<testname>.png`) \u0111\u01b0\u1ee3c ch\u1ee5p ngay l\u1eadp t\u1ee9c.\n2.  **Dump State**: L\u01b0u l\u1ea1i UI Hierarchy (XML/JSON) v\u00e0 Log thi\u1ebft b\u1ecb (Logcat/Syslog) t\u1ea1i th\u1eddi \u0111i\u1ec3m l\u1ed7i.\n3.  **Teardown**: Flow Teardown v\u1eabn \u0111\u01b0\u1ee3c k\u00edch ho\u1ea1t \u0111\u1ec3 \u0111\u1ea3m b\u1ea3o thi\u1ebft b\u1ecb s\u1ea1ch s\u1ebd cho b\u00e0i test ti\u1ebfp theo.\n4.  **Reporting**: L\u1ed7i \u0111\u01b0\u1ee3c ghi nh\u1eadn v\u00e0o b\u00e1o c\u00e1o HTML/JSON c\u00f9ng v\u1edbi c\u00e1c file \u0111\u00ednh k\u00e8m (\u1ea3nh, log).\n", "writing_tests": "# \u270d\ufe0f H\u01b0\u1edbng d\u1eabn Vi\u1ebft Test\n\nT\u00e0i li\u1ec7u n\u00e0y gi\u00fap b\u1ea1n hi\u1ec3u r\u00f5 c\u1ea5u tr\u00fac file k\u1ecbch b\u1ea3n test v\u00e0 c\u00e1ch t\u1ed5 ch\u1ee9c m\u1ed9t test flow hi\u1ec7u qu\u1ea3.\n\n## \ud83d\udcc4 C\u1ea5u tr\u00fac File YAML\n\n`lumi-tester` ch\u1ea5p nh\u1eadn hai \u0111\u1ecbnh d\u1ea1ng file \u0111\u1ec3 ph\u00f9 h\u1ee3p v\u1edbi nhu c\u1ea7u \u0111\u01a1n gi\u1ea3n ho\u1eb7c ph\u1ee9c t\u1ea1p.\n\n### 1. \u0110\u1ecbnh d\u1ea1ng Ph\u00e2n t\u00e1ch (Header --- Steps)\n\u0110\u00e2y l\u00e0 \u0111\u1ecbnh d\u1ea1ng khuy\u1ebfn ngh\u1ecb cho c\u00e1c test th\u1ef1c t\u1ebf. S\u1eed d\u1ee5ng d\u1ea5u `---` \u0111\u1ec3 t\u00e1ch bi\u1ec7t ph\u1ea7n khai b\u00e1o c\u1ea5u h\u00ecnh v\u00e0 danh s\u00e1ch c\u00e1c l\u1ec7nh th\u1ef1c thi.\n\n```yaml\nappId: com.example.app\nplatform: android\ntags:\n  - smoke\n  - regression\n---\n- launchApp\n- tap: \"Login\"\n```\n\n### 2. \u0110\u1ecbnh d\u1ea1ng Map (Single Block)\nPh\u00f9 h\u1ee3p khi b\u1ea1n mu\u1ed1n \u0111\u1ecbnh ngh\u0129a to\u00e0n b\u1ed9 test trong m\u1ed9t c\u1ea5u tr\u00fac map duy nh\u1ea5t, ho\u1eb7c khi Test Flow \u0111\u01b0\u1ee3c l\u1ed3ng v\u00e0o m\u1ed9t h\u1ec7 th\u1ed1ng kh\u00e1c.\n\n```yaml\nappId: com.example.app\nsteps: # Ho\u1eb7c 'commands'\n  - open: \"com.example.app\"\n  - tap: \"Login\"\n```\n\n---\n\n## \ud83d\udccb C\u00e1c tr\u01b0\u1eddng Header (Khai b\u00e1o)\n\nPh\u1ea7n Header n\u1eb1m ph\u00eda tr\u00ean d\u1ea5u `---`. N\u1ebfu kh\u00f4ng c\u00f3 d\u1ea5u `---`, c\u00e1c tr\u01b0\u1eddng n\u00e0y c\u00f3 th\u1ec3 khai b\u00e1o c\u00f9ng c\u1ea5p v\u1edbi `steps`.\n\n| Tr\u01b0\u1eddng | Alias | Ki\u1ec3u d\u1eef li\u1ec7u | M\u00f4 t\u1ea3 |\n| :--- | :--- | :--- | :--- |\n| `appId` | - | String | Package name (Android), Bundle ID (iOS), `.app` path/bundle id (macOS), ho\u1eb7c `.exe` path (Windows). |\n| `url` | - | String | URL kh\u1edfi t\u1ea1o (Web). |\n| `platform` | - | String | `android`, `android_auto`, `ios`, `web`, `macos`, `windows`. |\n| `desktopState` | - | Map | C\u1ea5u h\u00ecnh x\u00f3a state cho desktop; d\u00f9ng `desktopState.clear` c\u00f9ng `launchApp: { clearState: true }` tr\u00ean macOS/Windows. |\n| `env` | `vars`, `var`| Map | \u0110\u1ecbnh ngh\u0129a bi\u1ebfn m\u00f4i tr\u01b0\u1eddng (Key-Value) ho\u1eb7c load t\u1eeb file (`file: path`). |\n| `data` | - | String | Path t\u1edbi file d\u1eef li\u1ec7u (CSV/JSON). |\n| `defaultTimeout` | - | Number | Th\u1eddi gian ch\u1edd m\u1eb7c \u0111\u1ecbnh (ms) cho c\u00e1c l\u1ec7nh. |\n| `tags` | - | Array | Danh s\u00e1ch nh\u00e3n ph\u00e2n lo\u1ea1i test. |\n| `speed` | - | String | T\u1ed1c \u0111\u1ed9: `turbo`, `fast`, `normal`, `safe`. |\n| `browser` | - | String | (Web) `Chrome`, `Firefox`, `Webkit`. |\n| `closeWhenFinish`| - | Boolean | T\u1ef1 \u0111\u1ed9ng \u0111\u00f3ng app khi k\u1ebft th\u00fac. |\n| `steps` | `commands` | Array | Danh s\u00e1ch c\u00e1c l\u1ec7nh (D\u00f9ng trong \u0111\u1ecbnh d\u1ea1ng Map). |\n\n---\n\n## \ud83d\udd0d C\u00e1ch t\u00ecm Elements (Selectors)\n\n`lumi-tester` h\u1ed7 tr\u1ee3 nhi\u1ec1u c\u00e1ch \u0111\u1ec3 x\u00e1c \u0111\u1ecbnh element tr\u00ean m\u00e0n h\u00ecnh:\n\n1.  **Theo Text**: T\u00ecm v\u0103n b\u1ea3n hi\u1ec3n th\u1ecb (case-insensitive).\n    ```yaml\n    - tap: \"Login\"\n    ```\n2.  **Theo Resource ID**: ID \u0111\u1ecbnh danh trong code. (Alias: `id`)\n    ```yaml\n    - tap:\n        id: \"btn_login\"\n    ```\n3.  **Theo T\u1ecda \u0111\u1ed9**: Ph\u00f9 h\u1ee3p khi element kh\u00f4ng c\u00f3 \u0111\u1ecbnh danh. (Alias: `point`)\n    ```yaml\n    - tap:\n        point: \"50%,80%\"\n    ```\n4.  **Theo Regex**: T\u00ecm theo bi\u1ec3u m\u1eabu c\u1ee7a ch\u1eef. (Alias: `regex`)\n    ```yaml\n    - see:\n        regex: \"OTP: \\\\d{6}\"\n    ```\n5.  **Theo V\u1ecb tr\u00ed t\u01b0\u01a1ng \u0111\u1ed1i**: (Aliases: `rightOf`, `leftOf`, `above`, `below`)\n    ```yaml\n    - tap:\n        rightOf: \"Username\"\n        type: \"EditText\"\n    ```\n6.  **Theo M\u00f4 t\u1ea3 (Accessibility)**: (Aliases: `desc`, `contentDesc`, `accessibilityId`)\n    ```yaml\n    - tap:\n        desc: \"N\u00fat L\u01b0u\"\n    ```\n\n### \ud83e\uddf1 T\u00ecm hi\u1ec3u v\u1ec1 `type` (Element Type)\nTr\u01b0\u1eddng `type` gi\u00fap ch\u1ec9 \u0111\u1ecbnh lo\u1ea1i th\u00e0nh ph\u1ea7n:\n- **Android**: `Button`, `EditText`, `TextView`, `ImageView`, `CheckBox`, `Switch`.\n- **iOS**: `Button`, `TextField`, `SecureTextField`, `StaticText`, `Image`, `Cell`.\n- **Web**: `input`, `button`, `a`, `span`, `div`, `p`.\n\n---\n\n## \ud83d\udce6 Bi\u1ebfn s\u1ed1 v\u00e0 Substitutions\n\nS\u1eed d\u1ee5ng `${variable_name}` \u0111\u1ec3 truy xu\u1ea5t bi\u1ebfn.\n```yaml\nvars:\n  username: \"test_user\"\n---\n- write: \"${username}\"\n```\n\n---\n\n## \ud83e\udd1d Best Practices\n\n1.  **S\u1eed d\u1ee5ng `setup.yaml` & `teardown.yaml`**: \u0110\u1ec3 t\u00e1i s\u1eed d\u1ee5ng code login/logout.\n2.  **Tr\u00e1nh T\u1ecda \u0111\u1ed9 C\u1ee9ng**: Lu\u00f4n \u01b0u ti\u00ean Text, ID. N\u1ebfu d\u00f9ng t\u1ecda \u0111\u1ed9, h\u00e3y d\u00f9ng percentage.\n3.  **S\u00e2u chu\u1ed7i sub-flows**: D\u00f9ng `runFlow` \u0111\u1ec3 module h\u00f3a k\u1ecbch b\u1ea3n.\n\n## \ud83d\udcc1 T\u1ed5 ch\u1ee9c th\u01b0 m\u1ee5c\n\n```text\ntests/\n\u251c\u2500\u2500 setup.yaml\n\u251c\u2500\u2500 data/\n\u251c\u2500\u2500 common/             # Sub-flows (Login.yaml)\n\u2514\u2500\u2500 scenarios/          # Test ch\u00ednh\n```\n", "ai_authoring": "# AI Authoring Contract\n\nThis document defines the Lumi YAML style expected from AI agents and automated\ntest generators.\n\n## Required Loop\n\n```bash\nlumi-tester validate ./test.yaml --json\nlumi-tester list ./test.yaml --json\nlumi-tester doctor --platform <platform> --json\nlumi-tester run ./test.yaml --platform <platform> --report --snapshot --events-jsonl --output ./output\n```\n\nWhen using the source checkout:\n\n```bash\ncd lumi-tester\ncargo run -- validate ./test.yaml --json\ncargo run -- list ./test.yaml --json\ncargo run -- doctor --platform <platform> --json\ncargo run -- run ./test.yaml --platform <platform> --report --snapshot --events-jsonl --output ./output\n```\n\nUse an explicit platform for every device/browser/desktop run:\n\n```bash\nlumi-tester doctor --platform android --json\nlumi-tester doctor --platform android_auto --json\nlumi-tester doctor --platform ios --json\nlumi-tester doctor --platform web --json\nlumi-tester doctor --platform macos --json\nlumi-tester doctor --platform windows --json\n```\n\n`doctor --platform all --json` is useful for environment audits, but AI agents\nshould still run the exact target platform before executing a flow.\n\n## Canonical File Shape\n\n```yaml\nplatform: web\nurl: \"https://example.com\"\nbrowser: Chrome\ndefaultTimeout: 10000\ntags:\n  - smoke\n---\n- launchApp\n- tap:\n    text: \"Sign in\"\n    exact: true\n- inputText: \"user@example.com\"\n- see:\n    text: \"Dashboard\"\n```\n\nAgents should emit this `header --- commands` shape unless the user explicitly\nasks for top-level `steps:`.\n\nBefore choosing header fields, search\n`ai/codex-skill/lumi-tester-agent/references/headers.csv` for platform support,\naliases, examples, and desktop `desktopState.clear` schema. After\n`lumi-tester ai install`, the same file is available at\n`~/.codex/skills/lumi-tester-agent/references/headers.csv`.\n\nAlways set the platform and app identity explicitly:\n\n- Android: `platform: android` with package name in `appId`.\n- Android Auto: `platform: android_auto` with package name in `appId` and DHU\n  available.\n- iOS: `platform: ios` with bundle id in `appId`.\n- Web: `platform: web` with `url`.\n- macOS: `platform: macos` with `.app` path or bundle id in `appId`.\n- Windows: `platform: windows` with executable path in `appId`.\n\n## State Reset\n\nUse `clearState: true` only when the test intentionally needs first-run or\nfresh-session behavior. Prefer shared setup flows, seeded data, or grouped suite\nexecution when later test files depend on login/session state.\n\nAndroid and iOS can clear state from the app identity directly:\n\n```yaml\nplatform: android\nappId: com.example.app\n---\n- launchApp:\n    clearState: true\n```\n\nFor macOS and Windows, always pair `launchApp: { clearState: true }` with a\nheader-level `desktopState.clear` plan. Do not use Android-only `clearAppData`\nfor desktop apps.\n\n```yaml\nplatform: macos\nappId: /Applications/MyApp.app\ndesktopState:\n  clear:\n    mode: autoSafe\n---\n- launchApp:\n    clearState: true\n```\n\n```yaml\nplatform: windows\nappId: C:\\Program Files\\Example\\Example.exe\ndesktopState:\n  clear:\n    mode: autoSafe\n---\n- launchApp:\n    clearState: true\n```\n\nUse `mode: autoSafe` by default. Use `mode: manual` only when explicit\napp-scoped paths, macOS Keychain services, or Windows `HKCU:\\Software\\...`\nregistry keys are known and documented in the test header.\n\n## Launch Readiness And Shared Setup\n\nAfter `launchApp`, wait for a stable screen element with `waitUntilVisible` or\n`waitSee`; do not use a fixed `wait` as launch readiness. Android Auto is the\nexception because the DHU driver has no UI hierarchy; use a bounded `wait` plus\nscreenshot/log assertions there.\n\nUse `permissions` only when the testcase requires a pre-granted or pre-denied\nstate. Do not assume `permissions: { all: allow }` is correct for every flow.\nFor permission behavior, write separate allow/deny cases or reusable\npermission setup flows.\n\nWhen tests depend on login, permission setup, seeded data, `setup.yaml`, or\n`clearState`, validate/list/run the folder or group instead of a leaf file:\n\n```bash\nlumi-tester validate tests/generated/account --json\nlumi-tester list tests/generated/account --json\nlumi-tester run tests/generated/account --platform <platform> --report --snapshot --events-jsonl --output ./output/account\n```\n\nUse `runFlow` for reusable login, permission, and cleanup blocks. Keep generated\ntest files under a feature folder such as `tests/generated/<feature>/` so setup,\ndata, subflows, and reports stay together.\n\n## Preferred Commands\n\nUse these names for new files:\n\n| Purpose | Preferred command |\n| --- | --- |\n| Launch app or URL | `launchApp` |\n| Tap | `tap` |\n| Enter text into focused field | `inputText` |\n| Assert visible | `see` |\n| Assert not visible | `notSee` |\n| Wait for visible | `waitUntilVisible` |\n| Scroll until visible | `scrollTo` |\n| Run subflow | `runFlow` |\n| Screenshot | `takeScreenshot` |\n\nAliases may parse, but agents should avoid mixing aliases in generated files.\n\n## Selector Rules\n\nBefore choosing a selector, search\n`ai/codex-skill/lumi-tester-agent/references/selectors.csv` for platform\nsupport, rank, and anti-patterns. For unfamiliar screens or selector failures,\nread `ai/codex-skill/lumi-tester-agent/references/selector-discovery.md`.\nAfter `lumi-tester ai install`, the same files are available under\n`~/.codex/skills/lumi-tester-agent/references/`.\n\nFast selector discovery loop:\n\n1. Use Inspector when available: `inspect`, then `inspector_get /api/hierarchy`\n   or `inspector_get /api/element-at?x=<x>&y=<y>`.\n2. If Inspector is not available, run with `--snapshot` and inspect\n   `uiHierarchyPath`/UI XML plus the linked screenshot.\n3. If MCP has a UI XML artifact, call `suggest_selectors` before manually\n   reading a large hierarchy.\n4. If the UI XML package or foreground app is not the expected app identity,\n   debug launch/crash/wrong target before tuning selectors.\n\nPrefer stable selectors:\n\n```yaml\n- tap:\n    id: \"login_button\"\n\n- tap:\n    desc: \"Login\"\n\n- see:\n    text: \"Welcome\"\n    exact: true\n\n- see:\n    regex: \"OTP: \\\\d{6}\"\n\n- tap:\n    ocr:\n      text: \"Continue\"\n      region: \"bottom-half\"\n```\n\nUse coordinates only when no semantic selector exists:\n\n```yaml\n- tap:\n    point: \"50%,82%\"\n```\n\n## Valid Text Input Pattern\n\nDo not put selector fields inside `inputText`. Focus first, type second.\n\n```yaml\n- tap:\n    id: \"email\"\n- inputText: \"test@example.com\"\n```\n\n## Machine-Readable Validation\n\n`validate --json` returns:\n\n```json\n{\n  \"valid\": true,\n  \"files\": [\n    {\n      \"path\": \"test.yaml\",\n      \"platform\": \"android\",\n      \"commandCount\": 4,\n      \"commands\": [\n        { \"index\": 0, \"name\": \"launchApp\" }\n      ]\n    }\n  ],\n  \"errors\": []\n}\n```\n\nIf `valid` is false, fix the YAML before running device tests.\n\n`list --json` returns the same file and command-index shape without the `valid`\nand `errors` fields. Use those indexes for targeted reruns.\n\n## Runtime Artifacts\n\nAfter executor finalization:\n\n- `output/run.json` is always written and contains the session summary, flows,\n  commands, failures, duration, and artifact paths.\n- `output/test-results.json`, `output/report.html`, and `output/junit.xml` are\n  written when `--report` is enabled.\n- `output/events.jsonl` is written when `--events-jsonl` is enabled.\n- Failed commands may include `screenshotPath`, `uiHierarchyPath`, and `logPath`\n  when `--snapshot` or `--report` is enabled.\n\n## Failure Debug Loop\n\nWhen a run fails:\n\n1. Read the first failed command from `output/run.json` or\n   `output/test-results.json`.\n2. Use `list --json` to confirm the command index; do not count YAML commands\n   by hand.\n3. Inspect linked `screenshotPath`, `uiHierarchyPath`, and `logPath` before\n   editing selectors or waits.\n4. Patch the smallest YAML/setup issue.\n5. Rerun only the failed command:\n\n```bash\nlumi-tester run ./test.yaml --platform <platform> --command-index <index> --report --snapshot --events-jsonl --output ./output\n```\n\n6. After the targeted rerun passes, rerun the whole flow with the same\n   `--report --snapshot --events-jsonl` artifact flags.\n\nFor ambiguous failures, read\n`ai/codex-skill/lumi-tester-agent/references/debug-artifacts.md` and classify\nthe issue as wrong target, setup/state, app/runtime, or selector before editing\nYAML. On machines with the installed Codex skill, read the same file from\n`~/.codex/skills/lumi-tester-agent/references/debug-artifacts.md`.\n\n## Schema\n\nRetrieve the bundled schema with:\n\n```bash\nlumi-tester schema --json\n```\n\nThe schema is intentionally conservative and should be treated as an authoring\naid. `validate --json` remains the source of truth because it uses the Rust\nparser.\n"};
        const pageNames = {
            "commands": "Commands Reference",
            "python_integration": "Python Integration",
            "flows": "Test Flows",
            "writing_tests": "Writing Tests",
            "ai_authoring": "AI Authoring"
        };

        function loadPage(pageKey, highlightTerm) {
            const contentDiv = document.getElementById('content');
            const markdown = docs[pageKey] || '# Page not found';
            contentDiv.innerHTML = marked.parse(markdown);
            hljs.highlightAll();

            // Update active sidebar state
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('active');
                if (el.getAttribute('onclick') && el.getAttribute('onclick').includes(`'${pageKey}'`)) {
                    el.classList.add('active');
                }
            });

            if (highlightTerm) {
                const term = decodeURIComponent(highlightTerm).trim();
                if (term) {
                    highlightAndScrollTo(term);
                    return;
                }
            }
            contentDiv.scrollTop = 0;
        }

        function highlightAndScrollTo(term) {
            const contentDiv = document.getElementById('content');
            const safeTerm = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${safeTerm})`, 'gi');

            const walker = document.createTreeWalker(contentDiv, NodeFilter.SHOW_TEXT, null, false);
            const textNodes = [];
            let node;
            while (node = walker.nextNode()) {
                if (node.parentElement && ['SCRIPT', 'STYLE'].includes(node.parentElement.tagName)) continue;
                if (node.nodeValue && regex.test(node.nodeValue)) {
                    textNodes.push(node);
                }
            }

            let firstEl = null;
            textNodes.forEach(textNode => {
                const parent = textNode.parentElement;
                if (!parent) return;
                const temp = document.createElement('span');
                temp.innerHTML = textNode.nodeValue.replace(regex, '<mark class="highlight-match">$1</mark>');
                parent.replaceChild(temp, textNode);
                if (!firstEl) {
                    firstEl = temp.querySelector('mark');
                }
            });

            if (firstEl) {
                setTimeout(() => {
                    firstEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 50);
            } else {
                contentDiv.scrollTop = 0;
            }
        }

        function handleSearch() {
            const query = document.getElementById('search-input').value.trim();
            const lowerQuery = query.toLowerCase();
            const contentDiv = document.getElementById('content');

            if (!query) {
                loadPage('commands');
                return;
            }

            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            let resultsHtml = `<h1>Search Results for "${escapeHtml(query)}"</h1>`;
            let foundCount = 0;

            for (const [key, content] of Object.entries(docs)) {
                const lowerContent = content.toLowerCase();
                let index = 0;
                let matchesInDoc = 0;

                while ((index = lowerContent.indexOf(lowerQuery, index)) !== -1) {
                    foundCount++;
                    matchesInDoc++;

                    const pageName = pageNames[key] || key;
                    const start = Math.max(0, index - 60);
                    const end = Math.min(content.length, index + lowerQuery.length + 80);
                    let snippet = content.substring(start, end).replace(/[\r\n]+/g, ' ');

                    const safeQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const regex = new RegExp(`(${safeQuery})`, 'gi');
                    snippet = escapeHtml(snippet).replace(regex, '<span class="highlight-match">$1</span>');

                    resultsHtml += `
                        <div class="search-result-item">
                            <a href="javascript:void(0)" onclick="loadPage('${key}', '${encodeURIComponent(query)}')">${escapeHtml(pageName)}</a>
                            <div class="search-result-snippet">...${snippet}...</div>
                        </div>
                    `;

                    index += lowerQuery.length;
                    if (matchesInDoc >= 5) break;
                }
            }

            if (foundCount === 0) {
                resultsHtml += '<p>No matching results found.</p>';
            }

            contentDiv.innerHTML = resultsHtml;
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Initial load
        loadPage('commands');
    </script>
