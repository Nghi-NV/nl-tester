platform: android
appId: com.lumi.lifenext
tags:
  - hardware
  - pairing
defaultTimeout: 10000

# 🔌 Kết nối Jig toàn cục
jig: "COM5"

---
# 1. Cấp nguồn cho công tắc thông minh
- hwPowerOn: 1

# 2. Nhấn giữ nút trong 5 giây để vào chế độ Pairing (Factory Reset)
- hwPress: 1
- hwSeeLedBlink:
    channel: 1
    timeoutMs: 8000
- hwRelease: 1

# 3. Thao tác trên App Android để bắt đầu quét thiết bị
- tap:
    id: "add_device_button"
- tap:
    text: "Công tắc thông minh"

# 4. Kiểm tra sau khi Pair thành công đèn LED chuyển sang Xanh Lá
- hwSeeLed: "GREEN"
