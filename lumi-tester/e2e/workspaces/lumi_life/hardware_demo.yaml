platform: android
appId: com.lumi.lifenext
tags:
  - hardware
  - smoke
  - e2e
defaultTimeout: 5000

# 🔌 Khai báo kết nối Jig phần cứng toàn cục (Tự động connect trước test & disconnect sau test)
jig: "COM5"

---
# 1. Bật nguồn Rơ-le cấp nguồn cho thiết bị
- turnOn: 1

# 2. Kiểm tra trạng thái LED ban đầu (chờ màu Xanh lá hoặc Xanh dương)
- seeLedColor: "GREEN"

# 3. Bấm nút vật lý đơn hoặc bấm nhấp liên tục N lần (ví dụ: bấm 3 lần liên tiếp để vào Mode)
- clickButton: 1
- repeatClick:
    channel: 1
    count: 3
    pressMs: 200
    releaseMs: 200

# 4. Nhấn giữ nút vật lý (Hold button để Pair/Reset) & kiểm tra LED chớp tắt
- holdButton: 1
- seeLedBlink: 1
- releaseButton: 1

# 5. Khởi động lại phần cứng (Hard Power Reboot: Ngắt điện -> chờ 1 giây -> bật lại)
- powerCycle: 1

# 6. Kiểm tra sau khi khởi động xong đèn LED tắt hẳn
- seeLedOff: 1

# 7. Tắt toàn bộ nguồn phần cứng an toàn
- turnOffAll
