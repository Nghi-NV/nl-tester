platform: android
appId: com.lumi.lifenext
tags:
  - hardware
  - full-suite
defaultTimeout: 10000

# 🔌 Nạp cấu hình Jig & Servo dùng chung từ Profile
jig: "profiles/jig_switch_sample.yaml"

---
# 1. Điều khiển nguồn Rơ-le (Servo đã được tự động nạp cấu hình từ profile)
- hwPowerOn: 1
- hwPowerCycle:
    channel: 1
    offMs: 1000

# 3. Điều khiển Servo bấm/nhấn/nhả nút
- hwClick: 1
- hwPress: 1
- hwRotate:
    channel: 1
    angle: 90
    speed: 50
- wait: 1000
- hwRelease: 1

- hwRepeatClick:
    channel: 1
    count: 3
    pressMs: 150
    releaseMs: 150

- hwStartRepeatClick:
    channel: 1
    periodMs: 1500
- wait: 3000
- hwStopRepeatClick: 1
- hwReleaseAll

# 4. Điều khiển Đèn & Cảm biến màu sắc / Nháy LED
- hwSensorLight: "on"
- hwSeeLed: "GREEN"
- hwSeeLedBlink:
    channel: 1
    color: "BLUE"
    count: 2
- hwSeeLedOff: 1

- hwSetBrightnessThresholds:
    channel: 1
    offBelowPercent: 30
    onAbovePercent: 70
    minPulseMs: 50
    maxPulseMs: 1000
    sequenceEndGapMs: 500

- hwSensorLight: "off"

# 5. Hiệu chuẩn phần cứng (Calibration)
- hwCalibrateColor:
    channel: 1
    color: "RED"

- hwCalibrateBrightness:
    channel: 1
    mode: "dark"

- hwAddCctPoint:
    channel: 1
    knownKelvin: 4000

- hwSaveCalibration
- hwLoadCalibration

# 6. Đọc trạng thái cảm biến, nút bấm, relay và đèn LED
- hwReadServo: 1
- hwReadRelay: 1
- hwReadColor: 1
- hwReadSensorLight: 1

# 7. Chẩn đoán & Trạng thái an toàn
- hwDiagnostics
- hwSafeState
- hwPowerOffAll
