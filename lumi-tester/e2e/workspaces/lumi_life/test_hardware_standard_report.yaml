platform: android
appId: com.lumi.lifenext
tags:
  - smoke
  - hardware
defaultTimeout: 5000

---
# 1. Khai báo & Cấu hình Servo phần cứng
- configureServo:
    channel: 1
    pressAngle: 75
    releaseAngle: 15
    pressDurationMs: 300
    releaseDurationMs: 150
    holdDurationMs: 200

# 2. Thực hiện thao tác Servo (Press, Rotate, Release)
- pressButton: 1
- rotateServo:
    channel: 1
    angle: 90
    speed: 50
- releaseButton: 1

# 3. Đọc dữ liệu cảm biến & Relay
- readServo: 1
- readRelay: 1
- readColor: 1
