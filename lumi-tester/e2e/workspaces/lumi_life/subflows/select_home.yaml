platform: android
appId: com.lumi.lumilife
name: Select Lumi Life home
tags:
  - lumi-life
  - select-home
---
- waitUntilVisible: "(Select home|Chọn nhà|Chọn Home)"

- waitUntilVisible:
    regex: "Online|Trực tuyến"
- tap:
    type: "input"
- eraseText
- inputText:
    text: "nha 3d"
- hideKeyboard
- waitUntilVisible:
    regex: "Nhà 3D"
- tap:
    point: "50%,37%"
- waitForAnimationToEnd
- waitUntilVisible:
    regex: "(Security|Devices & Groups|Scene|AI camera)"
