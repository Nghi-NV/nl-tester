platform: web
appId: "http://localhost:8000/e2e/web/index.html"
---
- open: "http://localhost:8000/e2e/web/index.html"

# 1. Test Console Logs
- tap: "Log Message"

# 2. Test Mock Location
- mockLocation:
    file: "test.gpx"
- tap: "Get Location"
- waitForLocation:
    lat: 37.7749
    lon: -122.4194
    tolerance: 0.001
    timeout: 5000
- see: "37.7749, -122.4194"

# 3. Test Network (Offline)
- airplaneMode: {}
# Note: Offline mode might break further navigation, but we are just testing the toggle.

# 4. Test CPU Throttling
- setCpuThrottling: 4

# 5. Test Network Conditions
- setNetworkConditions: "slow-3g"
- wait: 200
