name: Sign Lumi IDE Windows installers

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Lumi IDE Build run ID containing the Lumi-IDE-Windows artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  sign:
    name: Sign Windows installers with SignPath
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download unsigned Windows installers
        uses: actions/download-artifact@v8
        with:
          name: Lumi-IDE-Windows
          path: unsigned
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: Upload installers for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: Lumi-IDE-Windows-Unsigned
          path: unsigned/
          if-no-files-found: error
          retention-days: 1

      - name: Sign Windows installers with SignPath
        id: sign
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_IDE_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          github-token: ${{ github.token }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/lumi-ide-signed

      - name: Verify installer signatures
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/lumi-ide-signed" -File -Recurse |
            Where-Object { $_.Extension -in @(".msi", ".exe") })
          if ($files.Count -ne 2) {
            throw "Expected one MSI and one EXE from SignPath; received $($files.Count) installer files."
          }

          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Invalid Authenticode signature on $($file.Name): $($signature.StatusMessage)"
            }
            Write-Output "$($file.Name): $($signature.Status) ($($signature.SignerCertificate.Subject))"
          }

      - name: Upload signed Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: Lumi-IDE-Windows-Signed
          path: |
            ${{ runner.temp }}/lumi-ide-signed/**/*.msi
            ${{ runner.temp }}/lumi-ide-signed/**/*.exe
          if-no-files-found: error
          retention-days: 30
