name: Lumi IDE Release

on:
  push:
    tags:
      - "lumi-ide-v*"

permissions:
  contents: read

concurrency:
  group: lumi-ide-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-latest
            bundles: dmg
          - platform: Windows
            runner: windows-latest
            bundles: msi,nsis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: lumi-tester-studio/yarn.lock

      - name: Enable pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: lumi-tester-studio
        run: yarn install --frozen-lockfile

      - name: Download platform binaries
        working-directory: lumi-tester-studio
        run: yarn download-binaries

      - name: Build Lumi IDE installers
        working-directory: lumi-tester-studio
        run: yarn tauri build --ci --no-sign --bundles "${{ matrix.bundles }}"

      - name: Upload macOS installer for release
        if: matrix.platform == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: Lumi-IDE-macOS
          path: lumi-tester-studio/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows installers for release
        if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: Lumi-IDE-Windows
          path: |
            lumi-tester-studio/src-tauri/target/release/bundle/msi/*.msi
            lumi-tester-studio/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [build, sign-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Lumi IDE release tag
        id: release_version
        shell: bash
        run: |
          version="$(node -p "require('./lumi-tester-studio/package.json').version")"
          expected_tag="lumi-ide-v${version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Expected tag $expected_tag, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        working-directory: lumi-tester-studio
        shell: bash
        run: |
          awk -v version="${{ steps.release_version.outputs.version }}" '
            $0 ~ "^## \\[" version "\\]" { in_section=1; next }
            in_section && /^## / { exit }
            in_section { print }
          ' CHANGELOG.md > ../release-notes.md
          if [[ ! -s ../release-notes.md ]]; then
            echo "No changelog entry found for version ${{ steps.release_version.outputs.version }}" >&2
            exit 1
          fi

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          name: Lumi-IDE-macOS
          path: release-assets/macOS

      - name: Download signed Windows installers
        uses: actions/download-artifact@v8
        with:
          name: Lumi-IDE-Windows-Signed
          path: release-assets/Windows

      - name: Flatten release assets
        shell: bash
        run: |
          mkdir -p release-files
          find release-assets -type f -print0 | while IFS= read -r -d '' file; do
            cp "$file" "release-files/$(basename "$file")"
          done
          ls -la release-files

      - name: Publish Lumi IDE release
        uses: softprops/action-gh-release@v3
        with:
          name: Lumi IDE v${{ steps.release_version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: release-files/*
          fail_on_unmatched_files: true
          make_latest: false
          body_path: release-notes.md

  sign-windows:
    name: Sign Windows installers with SignPath
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      actions: read
    steps:
      - name: Download unsigned Windows installers
        uses: actions/download-artifact@v8
        with:
          name: Lumi-IDE-Windows
          path: unsigned

      - name: Upload installers for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: Lumi-IDE-Windows-Unsigned
          path: unsigned/
          if-no-files-found: error
          retention-days: 1

      - name: Sign Windows installers with SignPath
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_IDE_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          github-token: ${{ github.token }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/lumi-ide-signed

      - name: Verify installer signatures
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/lumi-ide-signed" -File -Recurse |
            Where-Object { $_.Extension -in @(".msi", ".exe") })
          if ($files.Count -ne 2) {
            throw "Expected one MSI and one EXE from SignPath; received $($files.Count) installer files."
          }

          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Invalid Authenticode signature on $($file.Name): $($signature.StatusMessage)"
            }
            Write-Output "$($file.Name): $($signature.Status) ($($signature.SignerCertificate.Subject))"
          }

      - name: Upload signed Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: Lumi-IDE-Windows-Signed
          path: |
            ${{ runner.temp }}/lumi-ide-signed/**/*.msi
            ${{ runner.temp }}/lumi-ide-signed/**/*.exe
          if-no-files-found: error
          retention-days: 30
