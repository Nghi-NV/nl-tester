name: Lumi IDE Release

on:
  push:
    tags:
      - "lumi-ide-v*"

permissions:
  contents: read

concurrency:
  group: lumi-ide-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-latest
            bundles: dmg
          - platform: Windows
            runner: windows-latest
            bundles: msi,nsis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: lumi-tester-studio/yarn.lock

      - name: Enable pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: lumi-tester-studio
        run: yarn install --frozen-lockfile

      - name: Download platform binaries
        working-directory: lumi-tester-studio
        run: yarn download-binaries

      - name: Build Lumi IDE installers
        working-directory: lumi-tester-studio
        run: yarn tauri build --ci --no-sign --bundles "${{ matrix.bundles }}"

      - name: Upload macOS installer for release
        if: matrix.platform == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: Lumi-IDE-macOS
          path: lumi-tester-studio/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows installers for release
        if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: Lumi-IDE-Windows
          path: |
            lumi-tester-studio/src-tauri/target/release/bundle/msi/*.msi
            lumi-tester-studio/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Lumi IDE release tag
        shell: bash
        run: |
          version="$(node -p "require('./lumi-tester-studio/package.json').version")"
          expected_tag="lumi-ide-v${version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Expected tag $expected_tag, got $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Flatten release assets
        shell: bash
        run: |
          mkdir -p release-files
          find release-assets -type f -print0 | while IFS= read -r -d '' file; do
            cp "$file" "release-files/$(basename "$file")"
          done
          ls -la release-files

      - name: Publish Lumi IDE release
        uses: softprops/action-gh-release@v3
        with:
          name: Lumi IDE ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: release-files/*
          fail_on_unmatched_files: true
          make_latest: false
          body: |
            Lumi IDE desktop installers for macOS and Windows.

            Installers in this release are currently unsigned.
